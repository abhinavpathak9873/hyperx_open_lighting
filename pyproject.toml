[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperx-open-lighting"
version = "0.2.1"
description = "Native Linux lighting control for selected HyperX devices"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "HyperX Open Lighting contributors"}]
classifiers = ["Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]

[project.urls]
Repository = "https://github.com/abhinavpathak9873/hyperx_open_lighting"
Issues = "https://github.com/abhinavpathak9873/hyperx_open_lighting/issues"

[project.scripts]
hyperx-open-lighting = "hyperx_open_lighting.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hyperx_open_lighting = ["*.json"]
